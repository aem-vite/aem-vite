name: Release Dry Run

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry_run:
    uses: ./.github/workflows/reusable-release.yml
    with:
      dry-run: true
    secrets: inherit
