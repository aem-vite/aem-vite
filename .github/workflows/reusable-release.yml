name: Reusable Release

on:
  workflow_call:
    inputs:
      dry-run:
        required: false
        default: false
        type: boolean
      java-version:
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: false
      GITHUB_ACTOR:
        required: false
      OSSRH_USERNAME:
        required: false
      OSSRH_PASSWORD:
        required: false
      OSSRH_GPG_KEY_NAME:
        required: false
      OSSRH_GPG_SECRET_KEY_PASSWORD:
        required: false
      OSSRH_GPG_SECRET_KEY:
        required: false

jobs:
  release:
    name: ${{ inputs.dry-run && 'Semantic Release + JReleaser Dry Run' || 'Release to Maven Central' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      packages: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        name: Install pnpm

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup JDK (dry run)
        if: ${{ inputs.dry-run }}
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: ${{ inputs.java-version }}
          cache: 'maven'
          distribution: 'adopt'

      - name: Setup JDK (publish)
        if: ${{ !inputs.dry-run }}
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: ${{ inputs.java-version }}
          cache: 'maven'
          distribution: 'adopt'
          server-id: central
          server-username: JRELEASER_MAVENCENTRAL_USERNAME
          server-password: JRELEASER_MAVENCENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: JRELEASER_GPG_PASSPHRASE

      - name: Build staged artifacts (Central Publish + Cloud profile)
        if: ${{ inputs.dry-run && secrets.OSSRH_USERNAME != '' && secrets.OSSRH_PASSWORD != '' && secrets.OSSRH_GPG_SECRET_KEY != '' && secrets.OSSRH_GPG_SECRET_KEY_PASSWORD != '' && vars.OSSRH_GPG_PUBLIC_KEY != '' }}
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          JRELEASER_GPG_KEYNAME: ${{ secrets.OSSRH_GPG_KEY_NAME }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ vars.OSSRH_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        run: mvn -B -Pcentral-publish,cloud -DskipTests -Dgpg.skip deploy --settings maven-settings.xml

      - name: Semantic release dry run
        if: ${{ inputs.dry-run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release --dry-run

      - name: JReleaser dry run
        if: ${{ inputs.dry-run && secrets.OSSRH_USERNAME != '' && secrets.OSSRH_PASSWORD != '' && secrets.OSSRH_GPG_SECRET_KEY != '' && secrets.OSSRH_GPG_SECRET_KEY_PASSWORD != '' && vars.OSSRH_GPG_PUBLIC_KEY != '' }}
        env:
          JRELEASER_DRY_RUN: true
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          JRELEASER_GPG_KEYNAME: ${{ secrets.OSSRH_GPG_KEY_NAME }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ vars.OSSRH_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        run: mvn -B jreleaser:deploy --settings maven-settings.xml --non-recursive

      - name: Release
        if: ${{ !inputs.dry-run }}
        env:
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          JRELEASER_GPG_KEYNAME: ${{ secrets.OSSRH_GPG_KEY_NAME }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ vars.OSSRH_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        run: |
          export GPG_TTY=$(tty)
          pnpm semantic-release
