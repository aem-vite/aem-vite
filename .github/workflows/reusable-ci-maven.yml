name: Reusable Maven CI Leg

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      java-version:
        required: true
        type: string
      run-sonar:
        required: false
        default: false
        type: boolean
    secrets:
      NVD_API_KEY:
        required: false
      SONAR_TOKEN:
        required: false

jobs:
  build_and_test:
    name: Build/Test (${{ inputs.profile }}, JDK ${{ inputs.java-version }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: ${{ inputs.java-version }}
          cache: 'maven'
          distribution: 'adopt'

      - name: Build and analyse
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -P${{ inputs.profile }},ci-${{ inputs.profile }} -am package -DskipTests -Dgpg.skip

      - name: Test core
        run: mvn -B -P${{ inputs.profile }} -Dgpg.skip test --file core/pom.xml

      - name: Build and analyse with SonarCloud
        if: ${{ inputs.run-sonar && secrets.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B -Dgpg.skip verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Pcoverage-report -Dsonar.projectKey=aem-vite_aem-vite
