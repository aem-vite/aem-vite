name: Release to Maven Central

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      issues: write
      packages: write
    uses: ./.github/workflows/reusable-release.yml
    with:
      dry-run: false
      java-version: '8'
    secrets: inherit
